# The whole product on one host. Values come from an env file, see
# .env.production.example:
#   docker compose -f compose.production.yaml --env-file <file> up -d --build
# Load the synthetic demo once, which wipes the database:
#   docker compose -f compose.production.yaml --env-file <file> run --rm demo-seed
name: streetproof

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?}
  # Browsers load photos from this address, so it must be reachable from outside.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:-streetproof}
  S3_REGION: ${S3_REGION:-us-east-1}
  APP_URL: ${APP_URL:?}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    entrypoint:
      ["sh", "/scripts/with-database-password.sh", "docker-entrypoint.sh"]
    command: ["postgres"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      POSTGRES_USER: streetproof
      POSTGRES_DB: streetproof
    volumes:
      - ./scripts/backup:/scripts:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetproof -d streetproof"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO stopped publishing images: Docker Hub and Quay refuse the pull, and the
  # last one is from September 2025. Chainguard builds it from source and keeps it
  # patched. Pinned by digest; update it on purpose.
  minio:
    image: cgr.dev/chainguard/minio@sha256:090010a3f73f6aa2dff606c61cd0de3640b22748abe19f4e48cce6dc9de7a53f
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    ports:
      - ${MINIO_PORT:-9000}:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies migrations and creates the bucket, then exits.
  prepare:
    build:
      context: .
      target: tools
    working_dir: /repo/packages/db
    command: ["node", "--import", "tsx", "scripts/prepare.ts"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?}
      MONITORING_TOKEN: ${MONITORING_TOKEN:-}
      # Voice notes are transcribed on the server, with the key kept there.
      META_API_KEY: ${META_API_KEY:?}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io}
    ports:
      - ${WEB_PORT:-3000}:3000
    depends_on:
      prepare:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: tools
    restart: unless-stopped
    environment:
      <<: *app-env
      META_API_KEY: ${META_API_KEY:?}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      prepare:
        condition: service_completed_successfully

  # Exits straight away without a token, and restarts only after a crash, so an
  # unused bot doesn't loop.
  telegram-bot:
    build:
      context: .
      target: tools
    restart: on-failure
    working_dir: /repo/apps/telegram-bot
    command: ["node", "--import", "tsx", "src/index.ts"]
    environment:
      <<: *app-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      META_API_KEY: ${META_API_KEY:?}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
    depends_on:
      prepare:
        condition: service_completed_successfully

  # Asks for the first organisation, building, locations and admin, then adds them.
  # Only runs when asked for by name, with a terminal: run --rm setup
  setup:
    profiles: [setup]
    build:
      context: .
      target: tools
    working_dir: /repo/packages/db
    command: ["node", "--import", "tsx", "scripts/setup.ts"]
    stdin_open: true
    tty: true
    environment: *app-env
    depends_on:
      prepare:
        condition: service_completed_successfully

  # Wipes the database and loads docs/demo-scenarios.md. Refuses if any tenant
  # isn't synthetic, and only runs when asked for by name.
  demo-seed:
    profiles: [demo]
    build:
      context: .
      target: tools
    working_dir: /repo/packages/db
    command:
      - sh
      - -c
      - node --import tsx scripts/seed.ts && node --import tsx scripts/seed-demo.ts
    environment: *app-env
    depends_on:
      prepare:
        condition: service_completed_successfully

  # Nightly database dump and photo copy, kept in the backups volume.
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint:
      [
        "sh",
        "/scripts/with-database-password.sh",
        "sh",
        "/scripts/backup-loop.sh",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      PGHOST: postgres
      PGUSER: streetproof
      PGDATABASE: streetproof
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup:/scripts:ro
      - backups:/backups
      - minio-data:/minio-data:ro
    depends_on:
      prepare:
        condition: service_completed_successfully

  # Copies finished backups to a bucket on another host once a day. Stops at once
  # without BACKUP_REMOTE_URL, and restarts only after a crash.
  backup-offsite:
    # The same image as minio: it carries the mc client and a shell.
    image: cgr.dev/chainguard/minio@sha256:090010a3f73f6aa2dff606c61cd0de3640b22748abe19f4e48cce6dc9de7a53f
    restart: on-failure
    entrypoint: ["sh", "/scripts/offsite-loop.sh"]
    environment:
      BACKUP_REMOTE_URL: ${BACKUP_REMOTE_URL:-}
      BACKUP_REMOTE_BUCKET: ${BACKUP_REMOTE_BUCKET:-}
      BACKUP_REMOTE_ACCESS_KEY: ${BACKUP_REMOTE_ACCESS_KEY:-}
      BACKUP_REMOTE_SECRET_KEY: ${BACKUP_REMOTE_SECRET_KEY:-}
    volumes:
      - ./scripts/backup:/scripts:ro
      - backups:/backups:ro

  # Puts one backup back. Only runs when asked for by name, see docs/deployment.md.
  restore:
    profiles: [restore]
    image: postgres:16
    entrypoint:
      ["sh", "/scripts/with-database-password.sh", "sh", "/scripts/restore.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      PGHOST: postgres
      PGUSER: streetproof
      PGDATABASE: streetproof
    volumes:
      - ./scripts/backup:/scripts:ro
      - backups:/backups:ro
      - minio-data:/minio-data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  backups:
