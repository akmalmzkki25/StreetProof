[project]
name = "streetproof-ai-eval"
version = "0.0.0"
description = "Scores StreetProof's AI drafts and proof checks against labelled synthetic cases."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ai-eval-score = "streetproof_ai_eval.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetproof_ai_eval"]
