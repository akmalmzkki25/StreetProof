[project]
name = "streetproof-workspace"
version = "0.0.0"
description = "Workspace root for StreetProof Python packages (AI evaluation, experiments, data scripts)."
requires-python = ">=3.12"
dependencies = ["streetproof-ai-eval"]

[tool.uv.sources]
streetproof-ai-eval = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["py/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", "plan", "node_modules", ".next", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["py"]
addopts = "-ra --strict-markers"
